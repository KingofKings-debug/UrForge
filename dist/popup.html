<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            width: 320px;
            background: #18181b;
            color: #e5e7eb;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 1.25rem;
        }
        h3 {
            margin-top: 0;
            margin-bottom: 1rem;
            font-size: 1.1rem;
            font-weight: 600;
            border-bottom: 1px solid #27272a;
            padding-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .subtitle {
            color: #a1a1aa;
            font-size: 0.8rem;
            margin-bottom: 1rem;
        }
        #exclusions-list {
            max-height: 200px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .exclusion-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #262626;
            padding: 0.5rem 0.75rem;
            border-radius: 0.375rem;
            font-size: 0.85rem;
            border: 1px solid #3f3f46;
        }
        .exclusion-domain {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 200px;
        }
        .btn-remove {
            background: transparent;
            color: #f43f5e;
            border: none;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 500;
            padding: 0.2rem 0.5rem;
            border-radius: 0.25rem;
            transition: background-color 0.2s;
        }
        .btn-remove:hover {
            background: rgba(244, 63, 94, 0.15);
        }
        .empty-state {
            color: #71717a;
            text-align: center;
            padding: 1.5rem;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <h3>
        <span>UpForge Dashboard</span>
    </h3>
    <div class="subtitle">Excluded Sites (No Interception)</div>
    <div id="exclusions-list">
        <!-- Dynamic list of domains -->
    </div>
    <script src="popup.js"></script>
</body>
</html>
