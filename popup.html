<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        :root {
            --bg-color: #1c1c1e;
            --surface-card: #2c2c2e;
            --surface-hover: #3a3a3c;
            --primary-color: #0071e3;
            --primary-hover: #0077ed;
            --text-primary: #f5f5f7;
            --text-secondary: #86868b;
            --border-color: rgba(255, 255, 255, 0.08);
            --danger-color: #ff453a;
        }
        body {
            width: 320px;
            background: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 1.15rem;
            -webkit-font-smoothing: antialiased;
        }
        .header {
            margin-top: 0;
            margin-bottom: 1.15rem;
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.75rem;
        }
        .section-title {
            color: var(--text-secondary);
            font-size: 0.72rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 0.5rem;
        }
        .engine-card {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            background: var(--surface-card);
            padding: 0.35rem;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            margin-bottom: 1.25rem;
        }
        .engine-option {
            cursor: pointer;
            display: block;
        }
        .engine-option input {
            display: none;
        }
        .engine-pill {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.55rem 0.75rem;
            border-radius: 8px;
            font-size: 0.825rem;
            font-weight: 500;
            color: var(--text-secondary);
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            user-select: none;
        }
        .engine-pill-sub {
            font-size: 0.72rem;
            color: #636366;
            font-weight: 400;
        }
        .engine-option input:checked + .engine-pill {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            font-weight: 600;
        }
        .engine-option input:checked + .engine-pill .engine-pill-sub {
            color: var(--text-secondary);
        }
        #exclusions-list {
            max-height: 180px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.45rem;
        }
        .exclusion-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--surface-card);
            padding: 0.5rem 0.75rem;
            border-radius: 8px;
            font-size: 0.825rem;
            border: 1px solid var(--border-color);
        }
        .exclusion-domain {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 200px;
            color: var(--text-primary);
        }
        .btn-remove {
            background: transparent;
            color: var(--danger-color);
            border: none;
            cursor: pointer;
            font-size: 0.78rem;
            font-weight: 500;
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            transition: opacity 0.2s;
        }
        .btn-remove:hover {
            opacity: 0.8;
        }
        .empty-state {
            color: var(--text-secondary);
            text-align: center;
            padding: 1.25rem;
            font-size: 0.825rem;
            background: var(--surface-card);
            border-radius: 8px;
            border: 1px dashed var(--border-color);
        }
    </style>
</head>
<body>
    <div class="header">
        <span>urforge</span>
    </div>

    <div class="section-title">Compression Engine</div>
    <div class="engine-card">
        <label class="engine-option">
            <input type="radio" name="popup-engine" value="wasm" checked>
            <span class="engine-pill">
                <span>Pro WASM</span>
                <span class="engine-pill-sub">High Fidelity</span>
            </span>
        </label>
        <label class="engine-option">
            <input type="radio" name="popup-engine" value="canvas">
            <span class="engine-pill">
                <span>Fast Canvas</span>
                <span class="engine-pill-sub">High Speed</span>
            </span>
        </label>
    </div>

    <div class="section-title">Excluded Websites</div>
    <div id="exclusions-list">
        <!-- Dynamic list of domains -->
    </div>
    <script src="popup.js"></script>
</body>
</html>
